<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Task Manager</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><h1>📚 Student Task Manager</h1><p>Plan your studies, one task at a time.</p></header><section class="panel"><form id="taskForm"><label for="taskTitle">New task</label><input id="taskTitle" maxlength="100" placeholder="e.g. Finish maths assignment" required><div class="fields"><label>Category<select id="category"><option>Study</option><option>Assignment</option><option>Project</option><option>Personal</option></select></label><label>Priority<select id="priority"><option>Medium</option><option>High</option><option>Low</option></select></label><label>Deadline<input id="deadline" type="date"></label></div><button type="submit" id="submitBtn">Add task</button><button type="button" id="cancelBtn" hidden>Cancel edit</button></form></section><section class="panel"><div class="summary"><strong id="progress">0 of 0 completed</strong><span id="percent">0%</span></div><div class="track"><div id="bar"></div></div><div class="toolbar"><label for="filter">Show</label><select id="filter"><option value="all">All tasks</option><option value="pending">Pending</option><option value="completed">Completed</option></select></div><ul id="tasks" aria-live="polite"></ul><p id="empty">No tasks yet. Add your first task!</p></section><footer>Made for students • Tasks are saved in this browser</footer></main><script src="script.js"></script></body></html>
